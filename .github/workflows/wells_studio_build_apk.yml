
name: Construire APK Wells Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip -o wells_studio_android_apk_source_1_0.zip -d source

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Trouver le projet Android
        run: |
          find source -name gradlew -type f
          find source -name build.gradle -o -name build.gradle.kts

      - name: Construire l'APK
        run: |
          cd source
          PROJECT_DIR="$(dirname "$(find . -name gradlew -type f | head -n 1)")"
          if [ "$PROJECT_DIR" = "." ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Aucun gradlew trouvé. Vérifier la structure du projet."
            exit 1
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Studio-APK-debug
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
